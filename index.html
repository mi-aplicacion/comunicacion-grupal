<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-fullscreen" content="yes">
    <title>🚀 Juego Espacial 3D — Pantalla Completa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: manipulation; }
        
        html, body {
            background: #000;
            color: #00ffff;
            font-family: Arial, sans-serif;
            height: 100%;
            height: 100dvh; /* ✅ Ocupa TODA la pantalla incluyendo zonas seguras */
            width: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* ✅ Oculta barras de navegación en celular */
            -webkit-overflow-scrolling: touch;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 520px;
            max-height: 95dvh;
            margin: 0 auto;
            background: radial-gradient(ellipse at center, #0f1628 0%, #000510 60%, #000 100%);
            display: flex;
            flex-direction: column;
            border: 3px solid;
            border-image: linear-gradient(135deg, #00ffff, #ff00ff, #00ffff) 1;
            box-shadow: 0 0 30px rgba(0,255,255,0.3);
            /* ✅ Espacio para no cortar nada */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* HUD */
        #hud {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: rgba(0,20,40,0.9);
            border-bottom: 2px solid #00ffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor;
            flex-shrink: 0;
        }
        .puntos { color: #00ff88; }
        .nivel { color: #ffff00; }
        .vida { color: #ff4466; }

        /* Canvas */
        #gameCanvas { flex: 1; display: block; width: 100%; height: 100%; }

        /* Controles — más arriba para que no queden debajo de los botones del sistema */
        #controls {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px 20px 15px;
            gap: 10px;
            background: rgba(0,15,30,0.95);
            border-top: 2px solid #ff00ff;
            flex-shrink: 0;
            padding-bottom: calc(15px + env(safe-area-inset-bottom)); /* ✅ Evita que queden pegados al borde */
        }
        .control-btn {
            flex: 1;
            padding: 16px 0;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            border: 2px solid #00ffff;
            background: rgba(0,255,255,0.15);
            color: #00ffff;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
            -webkit-tap-highlight-color: transparent;
            min-height: 60px;
        }
        #fireBtn {
            border-color: #ff0088;
            background: rgba(255,0,100,0.15);
            color: #ff0088;
            box-shadow: 0 0 15px rgba(255,0,100,0.3);
            font-size: 18px;
        }
        .control-btn:active { transform: scale(0.95); }

        /* Aviso de nivel */
        #level-announce {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #ffff00;
            text-shadow: 0 0 20px #ffff00;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
        }

        /* ✅ Botón para entrar a pantalla completa */
        #fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 20;
            background: rgba(0,255,255,0.2);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        #fullscreen-btn.hidden { display: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <button id="fullscreen-btn">⛶ PANTALLA COMPLETA</button>
        
        <div id="hud">
            <span class="puntos">🎯 <span id="score">0</span></span>
            <span class="nivel">📈 NIVEL <span id="level">1</span></span>
            <span class="vida">🛡️ <span id="lives">3</span></span>
        </div>
        
        <div id="level-announce">NIVEL 1</div>
        <canvas id="gameCanvas"></canvas>
        
        <div id="controls">
            <button class="control-btn" id="leftBtn">◀</button>
            <button class="control-btn" id="fireBtn">⚡ FUEGO</button>
            <button class="control-btn" id="rightBtn">▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const fullscreenBtn = document.getElementById("fullscreen-btn");

        // ✅ FUNCIÓN PARA PANTALLA COMPLETA — OCULTA BOTONES DEL CELULAR
        function entrarPantallaCompleta() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            
            // Ocultar barras en móvil
            setTimeout(() => {
                window.scrollTo(0, 0);
                fullscreenBtn.classList.add('hidden');
            }, 300);
        }
        fullscreenBtn.addEventListener("click", entrarPantallaCompleta);

        // Ajustar tamaño del canvas
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Variables del juego
        let score = 0, lives = 3, level = 1;
        let enemySpeed = 2, spawnInterval = 1800;
        let movingLeft = false, movingRight = false;
        let bullets = [], enemies = [], stars = [];
        let player = { x: 0, y: 0, w: 50, h: 50, speed: 6 };
        let gameRunning = true;

        // Generar estrellas
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * 500,
                y: Math.random() * 1000,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        // CONTROLES TÁCTILES
        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");
        const fireBtn = document.getElementById("fireBtn");

        leftBtn.addEventListener("touchstart", e => {e.preventDefault(); movingLeft = true;});
        leftBtn.addEventListener("touchend", () => movingLeft = false);
        leftBtn.addEventListener("mousedown", () => movingLeft = true);
        leftBtn.addEventListener("mouseup", () => movingLeft = false);

        rightBtn.addEventListener("touchstart", e => {e.preventDefault(); movingRight = true;});
        rightBtn.addEventListener("touchend", () => movingRight = false);
        rightBtn.addEventListener("mousedown", () => movingRight = true);
        rightBtn.addEventListener("mouseup", () => movingRight = false);

        function disparar() {
            bullets.push({x: player.x + 21, y: player.y, w: 8, h: 18, speed: 10});
        }
        fireBtn.addEventListener("touchstart", e => {e.preventDefault(); disparar();});
        fireBtn.addEventListener("click", disparar);

        // CONTROLES TECLADO
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" || e.key === "a") movingLeft = true;
            if (e.key === "ArrowRight" || e.key === "d") movingRight = true;
            if (e.key === " ") disparar();
        });
        window.addEventListener("keyup", e => {
            if (e.key === "ArrowLeft" || e.key === "a") movingLeft = false;
            if (e.key === "ArrowRight" || e.key === "d") movingRight = false;
        });

        // Crear enemigo
        function crearEnemigo() {
            enemies.push({
                x: Math.random() * (canvas.width - 50),
                y: -50,
                w: 45, h: 45,
                speed: enemySpeed,
                tipo: Math.random() > 0.7 ? "rapido" : "normal"
            });
        }

        // Generar enemigos cada cierto tiempo
        setInterval(crearEnemigo, spawnInterval);

        // Subir de nivel
        function subirNivel() {
            const nuevoNivel = Math.floor(score / 50) + 1;
            if (nuevoNivel > level) {
                level = nuevoNivel;
                document.getElementById("level").textContent = level;
                enemySpeed += 0.5;
                spawnInterval = Math.max(500, spawnInterval - 150);
                const aviso = document.getElementById("level-announce");
                aviso.textContent = `NIVEL ${level} ⚡`;
                aviso.style.opacity = "1";
                setTimeout(() => aviso.style.opacity = "0", 1500);
            }
        }

        // Game Over
        function gameOver() {
            alert(`¡JUEGO TERMINADO!\nPuntos: ${score}\nNivel alcanzado: ${level}`);
            score = 0; lives = 3; level = 1;
            enemySpeed = 2; spawnInterval = 1800;
            bullets = []; enemies = [];
            document.getElementById("score").textContent = score;
            document.getElementById("lives").textContent = lives;
            document.getElementById("level").textContent = level;
        }

        // Bucle principal
        function update() {
            if (!gameRunning) return;

            // Estrellas
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
            });

            // Mover nave
            if (movingLeft) player.x -= player.speed;
            if (movingRight) player.x += player.speed;
            player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
            player.y = canvas.height - 80;

            // Mover balas
            bullets.forEach((b, i) => {
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(i, 1);
            });

            // Mover enemigos y colisiones
            enemies.forEach((e, ei) => {
                e.y += e.speed;
                if (e.y > canvas.height) {
                    enemies.splice(ei, 1);
                    lives--;
                    document.getElementById("lives").textContent = lives;
                    if (lives <= 0) return gameOver();
                }

                // Colisión bala-enemigo
                bullets.forEach((b, bi) => {
                    if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                        bullets.splice(bi, 1);
                        enemies.splice(ei, 1);
                        score++;
                        document.getElementById("score").textContent = score;
                        subirNivel();
                    }
                });
            });
        }

        // Dibujar todo
        function draw() {
            // Fondo
            ctx.fillStyle = "#000510";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Estrellas
            ctx.fillStyle = "#fff";
            stars.forEach(s => {
                ctx.globalAlpha = 0.5 + Math.random() * 0.5;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Nave del jugador 🚀
            ctx.fillStyle = "#00ffff";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffff";
            ctx.beginPath();
            ctx.moveTo(player.x + player.w/2, player.y);
            ctx.lineTo(player.x + player.w, player.y + player.h);
            ctx.lineTo(player.x + player.w * 0.3, player.y + player.h * 0.7);
            ctx.lineTo(player.x + player.w * 0.7, player.y + player.h * 0.7);
            ctx.lineTo(player.x, player.y + player.h);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            // Balas ⚡
            ctx.fillStyle = "#00ffff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ffff";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
            ctx.shadowBlur = 0;

            // Enemigos 🛸
            enemies.forEach(e => {
                ctx.fillStyle = e.tipo === "rapido" ? "#ffcc00" : "#ff0088";
                ctx.shadowBlur = 15;
                ctx.shadowColor = e.tipo === "rapido" ? "#ffcc00" : "#ff0088";
                ctx.beginPath();
                ctx.ellipse(e.x + e.w/2, e.y + e.h/2, e.w/2, e.h/3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        // Bucle del juego
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
